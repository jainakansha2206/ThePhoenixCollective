server:
  port: 9090

spring:
  application:
    name: phoenix-api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/auth/**,/user/**
          filters:
            - StripPrefix=1

eureka:
  client:
    register-with-eureka: false
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  tracing:
    sampling:
      probability: 0.0
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,routes,info
  endpoint:
    health:
      show-details: always
